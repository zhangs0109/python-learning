    body: `<h3>核心理念</h3><ul><li>Git 是代码的时光机：工作区（在改）→ 暂存区（挑好了）→ 本地仓库（存档了）</li></ul>
      <h3>核心命令</h3><pre>git init                  # 把文件夹变成仓库
git status                # 红=未跟踪，绿=已暂存
git add -A                # 全部放进暂存区（-A 比 . 稳）
git commit -m "说明"      # 正式存档（动词开头写清做了什么）
git log --oneline         # 看历史，新的在上面
git diff                  # 看还没 add 的改动
git diff --staged         # 看已经 add 的改动
git restore --staged 文件 # 从暂存区撤回（改动保留）</pre>
      <h3>踩过的坑</h3><ul>
      <li>把邮箱误写进 user.name → 敲完必验：git config user.name</li>
      <li>中文文件名显示成一串数字 → git config --global core.quotepath false</li>
      <li>Git 规矩：没有输出 = 一切正常，只有报错才说话</li></ul>
      <h3>验收</h3><ul><li>两次提交（afc9972 / d40eff5），diff 精确对比 ✔</li></ul>` },

  l11: { title: "L11 · 虚拟环境与 pip", status: "已完成 ✔ ｜ 2026-11-01", color: "#0F6E56",
    body: `<h3>解决的问题</h3><ul><li>装第三方库不污染系统 Python，不同项目还能用不同版本</li></ul>

deactivate                       # 退出</pre>

    body: `<h3>核心</h3><ul><li>把 Excel 表看成 DataFrame，一行代码完成"筛选 + 分组 + 求和"</li></ul>

df = pd.read_excel("台账.xlsx", sheet_name="明细", header=2)

df.head()                  # 前 5 行
df["实耗量"].sum()         # 求和
over = df[df["超耗量"] &gt; 0]   # 筛选
df.loc[df["超耗量"] &lt; 0, "超耗金额"] = 0   # 条件批量赋值
df = df.sort_values("实耗金额", ascending=False)

g = df.groupby(["材料","部位","单位"], as_index=False).agg(
    笔数=("实耗量","count"),
    数量=("实耗量","sum"),
    金额=("实耗金额","sum"))
g["单价"] = (g["金额"] / g["数量"]).round(2)

df.to_excel("结果.xlsx", index=False)</pre>
